[project]
name = "opensre-plugin-cloudwatch"
version = "0.1.0"
description = "OpenSRE cloudwatch integration plugin (8 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "cloudwatch"
tools_package = "cloudwatch_plugin.tools"
description = "Bridged cloudwatch tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudwatch_plugin"]
