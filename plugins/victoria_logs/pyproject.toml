[project]
name = "opensre-plugin-victoria-logs"
version = "0.1.0"
description = "OpenSRE victoria_logs integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "victoria_logs"
tools_package = "victoria_logs_plugin.tools"
description = "Bridged victoria_logs tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["victoria_logs_plugin"]
