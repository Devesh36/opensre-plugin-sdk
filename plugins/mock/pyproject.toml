[project]
name = "opensre-plugin-mock"
version = "0.1.0"
description = "Mock HTTP plugin for OpenSRE SDK demos — no external API required"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.opensre-plugin]
name = "mock"
tools_package = "mock_plugin.tools"
description = "Mock search tool for offline SDK demos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_plugin"]
