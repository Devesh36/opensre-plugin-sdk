[project]
name = "opensre-plugin-batch"
version = "0.1.0"
description = "OpenSRE batch integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "batch"
tools_package = "batch_plugin.tools"
description = "Bridged batch tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch_plugin"]
