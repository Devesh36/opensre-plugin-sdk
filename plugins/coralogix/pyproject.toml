[project]
name = "opensre-plugin-coralogix"
version = "0.1.0"
description = "OpenSRE coralogix integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "coralogix"
tools_package = "coralogix_plugin.tools"
description = "Bridged coralogix tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coralogix_plugin"]
