[project]
name = "opensre-plugin-aws-sdk"
version = "0.1.0"
description = "OpenSRE aws_sdk integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "aws_sdk"
tools_package = "aws_sdk_plugin.tools"
description = "Bridged aws_sdk tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_sdk_plugin"]
