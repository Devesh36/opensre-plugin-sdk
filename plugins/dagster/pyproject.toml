[project]
name = "opensre-plugin-dagster"
version = "0.1.0"
description = "OpenSRE dagster integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "dagster"
tools_package = "dagster_plugin.tools"
description = "Bridged dagster tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_plugin"]
