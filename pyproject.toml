[project]
name = "opensre-plugin-sdk"
version = "0.1.0"
description = "SDK for building external OpenSRE investigation tool plugins"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenSRE Plugin SDK contributors" }]
keywords = ["opensre", "sre", "plugins", "observability", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8",
    "jinja2>=3",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Tracer-Cloud/opensre-plugin-sdk"
Documentation = "https://github.com/Tracer-Cloud/opensre-plugin-sdk#readme"
Repository = "https://github.com/Tracer-Cloud/opensre-plugin-sdk"
Issues = "https://github.com/Tracer-Cloud/opensre-plugin-sdk/issues"
Changelog = "https://github.com/Tracer-Cloud/opensre-plugin-sdk/releases"

[project.optional-dependencies]
opensre = ["opensre>=0.1"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.8"]

[project.scripts]
opensre-plugin = "opensre_plugin.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensre_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "opensre_plugin/templates"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring opensre installed",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures/integration_plugin"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opensre_plugin"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["app.*", "opensre"]
ignore_missing_imports = true
