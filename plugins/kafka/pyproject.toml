[project]
name = "opensre-plugin-kafka"
version = "0.1.0"
description = "OpenSRE kafka integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "kafka"
tools_package = "kafka_plugin.tools"
description = "Bridged kafka tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kafka_plugin"]
