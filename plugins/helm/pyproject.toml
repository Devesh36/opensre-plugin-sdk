[project]
name = "opensre-plugin-helm"
version = "0.1.0"
description = "OpenSRE helm integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "helm"
tools_package = "helm_plugin.tools"
description = "Bridged helm tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helm_plugin"]
