[project]
name = "opensre-plugin-rds"
version = "0.1.0"
description = "OpenSRE rds integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "rds"
tools_package = "rds_plugin.tools"
description = "Bridged rds tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rds_plugin"]
