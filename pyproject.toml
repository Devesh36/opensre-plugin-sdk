opensre-plugins = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring opensre installed",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures/integration_plugin", "plugins"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opensre_plugin"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["app.*", "opensre"]
ignore_missing_imports = true
