[project]
name = "opensre-plugin-openobserve"
version = "0.1.0"
description = "OpenSRE openobserve integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "openobserve"
tools_package = "openobserve_plugin.tools"
description = "Bridged openobserve tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openobserve_plugin"]
