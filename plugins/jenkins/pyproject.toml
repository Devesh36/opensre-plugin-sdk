[project]
name = "opensre-plugin-jenkins"
version = "0.1.0"
description = "OpenSRE jenkins integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "jenkins"
tools_package = "jenkins_plugin.tools"
description = "Bridged jenkins tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jenkins_plugin"]
