[project]
name = "opensre-plugin-hermes"
version = "0.1.0"
description = "OpenSRE hermes integration plugin (19 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "hermes"
tools_package = "hermes_plugin.tools"
description = "Bridged hermes tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_plugin"]
