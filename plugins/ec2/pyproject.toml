[project]
name = "opensre-plugin-ec2"
version = "0.1.0"
description = "OpenSRE ec2 integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "ec2"
tools_package = "ec2_plugin.tools"
description = "Bridged ec2 tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2_plugin"]
