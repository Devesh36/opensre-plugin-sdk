[project]
name = "opensre-plugin-datadog"
version = "0.1.0"
description = "OpenSRE datadog integration plugin (6 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "datadog"
tools_package = "datadog_plugin.tools"
description = "Bridged datadog tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datadog_plugin"]
