[project]
name = "opensre-plugin-azure-sql"
version = "0.1.0"
description = "OpenSRE azure_sql integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "azure_sql"
tools_package = "azure_sql_plugin.tools"
description = "Bridged azure_sql tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["azure_sql_plugin"]
