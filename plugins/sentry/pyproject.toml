[project]
name = "opensre-plugin-sentry"
version = "0.1.0"
description = "OpenSRE sentry integration plugin (3 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "sentry"
tools_package = "sentry_plugin.tools"
description = "Bridged sentry tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentry_plugin"]
