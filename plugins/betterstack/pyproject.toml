[project]
name = "opensre-plugin-betterstack"
version = "0.1.0"
description = "OpenSRE betterstack integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "betterstack"
tools_package = "betterstack_plugin.tools"
description = "Bridged betterstack tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["betterstack_plugin"]
