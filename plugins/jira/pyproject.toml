[project]
name = "opensre-plugin-jira"
version = "0.1.0"
description = "OpenSRE jira integration plugin (4 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "jira"
tools_package = "jira_plugin.tools"
description = "Bridged jira tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jira_plugin"]
