[project]
name = "opensre-plugin-tracer-web"
version = "0.1.0"
description = "OpenSRE tracer_web integration plugin (7 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "tracer_web"
tools_package = "tracer_web_plugin.tools"
description = "Bridged tracer_web tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracer_web_plugin"]
