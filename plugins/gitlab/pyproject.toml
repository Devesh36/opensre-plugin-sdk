[project]
name = "opensre-plugin-gitlab"
version = "0.1.0"
description = "OpenSRE gitlab integration plugin (4 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "gitlab"
tools_package = "gitlab_plugin.tools"
description = "Bridged gitlab tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitlab_plugin"]
