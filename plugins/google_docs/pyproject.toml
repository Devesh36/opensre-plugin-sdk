[project]
name = "opensre-plugin-google-docs"
version = "0.1.0"
description = "OpenSRE google_docs integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "google_docs"
tools_package = "google_docs_plugin.tools"
description = "Bridged google_docs tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["google_docs_plugin"]
