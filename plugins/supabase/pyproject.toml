[project]
name = "opensre-plugin-supabase"
version = "0.1.0"
description = "OpenSRE supabase integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "supabase"
tools_package = "supabase_plugin.tools"
description = "Bridged supabase tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supabase_plugin"]
