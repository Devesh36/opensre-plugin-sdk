[project]
name = "opensre-plugin-mysql"
version = "0.1.0"
description = "OpenSRE mysql integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "mysql"
tools_package = "mysql_plugin.tools"
description = "Bridged mysql tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mysql_plugin"]
