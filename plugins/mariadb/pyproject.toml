[project]
name = "opensre-plugin-mariadb"
version = "0.1.0"
description = "OpenSRE mariadb integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "mariadb"
tools_package = "mariadb_plugin.tools"
description = "Bridged mariadb tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mariadb_plugin"]
