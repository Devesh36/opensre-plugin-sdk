name: ci

on:
  push:
  pull_request:

env:
  # Pinned refs — not floating main. v2026.6.12+ includes register_external_tool_package.
  OPENSRE_GIT_REF: v2026.6.12
  OPENSRE_PYPI_VERSION: "2026.4.5"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install SDK
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ examples/ scripts/

      - name: Ruff format
        run: uv run ruff format --check src/ tests/ examples/ scripts/

      - name: Mypy
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/ -m "not integration" -v

  integration-git:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install SDK
        run: uv sync --extra dev

      - name: Install OpenSRE from pinned git tag
        run: >-
          uv pip install
          "opensre @ git+https://github.com/Tracer-Cloud/opensre.git@${{ env.OPENSRE_GIT_REF }}"

      - name: Verify external plugin API
        run: >-
          uv run python -c
          "from app.tools.registry import register_external_tool_package; print('OK')"

      - name: Integration tests
        run: uv run pytest tests/ -m integration -v

      - name: End-to-end demo
        run: uv run python scripts/demo_e2e.py

  integration-pypi:
    needs: unit
    runs-on: ubuntu-latest
    # Best-effort: PyPI may lag git; do not block merges if the hook is absent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install SDK
        run: uv sync --extra dev

      - name: Install OpenSRE from PyPI
        run: uv pip install "opensre==${{ env.OPENSRE_PYPI_VERSION }}"

      - name: Verify external plugin API on PyPI release
        id: pypi_capable
        run: >-
          uv run python -c
          "from app.tools.registry import register_external_tool_package; print('OK')"

      - name: Integration tests (PyPI)
        if: steps.pypi_capable.outcome == 'success'
        run: uv run pytest tests/ -m integration -v

      - name: End-to-end demo (PyPI)
        if: steps.pypi_capable.outcome == 'success'
        run: uv run python scripts/demo_e2e.py

      - name: Note skipped PyPI integration
        if: steps.pypi_capable.outcome != 'success'
        run: >-
          echo "::notice::PyPI opensre==${{ env.OPENSRE_PYPI_VERSION }} does not expose
          register_external_tool_package yet; git pin job covers integration."
