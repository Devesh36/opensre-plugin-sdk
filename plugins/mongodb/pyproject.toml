[project]
name = "opensre-plugin-mongodb"
version = "0.1.0"
description = "OpenSRE mongodb integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "mongodb"
tools_package = "mongodb_plugin.tools"
description = "Bridged mongodb tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mongodb_plugin"]
