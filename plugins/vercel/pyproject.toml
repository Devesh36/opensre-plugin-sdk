[project]
name = "opensre-plugin-vercel"
version = "0.1.0"
description = "OpenSRE vercel integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "vercel"
tools_package = "vercel_plugin.tools"
description = "Bridged vercel tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vercel_plugin"]
