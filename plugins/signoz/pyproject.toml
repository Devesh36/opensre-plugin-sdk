[project]
name = "opensre-plugin-signoz"
version = "0.1.0"
description = "OpenSRE signoz integration plugin (3 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "signoz"
tools_package = "signoz_plugin.tools"
description = "Bridged signoz tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signoz_plugin"]
