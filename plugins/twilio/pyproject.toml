[project]
name = "opensre-plugin-twilio"
version = "0.1.0"
description = "OpenSRE twilio integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "twilio"
tools_package = "twilio_plugin.tools"
description = "Bridged twilio tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twilio_plugin"]
