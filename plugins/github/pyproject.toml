[project]
name = "opensre-plugin-github"
version = "0.1.0"
description = "OpenSRE github integration plugin (9 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "github"
tools_package = "github_plugin.tools"
description = "Bridged github tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_plugin"]
