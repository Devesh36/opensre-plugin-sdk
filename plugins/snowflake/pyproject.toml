[project]
name = "opensre-plugin-snowflake"
version = "0.1.0"
description = "OpenSRE snowflake integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "snowflake"
tools_package = "snowflake_plugin.tools"
description = "Bridged snowflake tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snowflake_plugin"]
