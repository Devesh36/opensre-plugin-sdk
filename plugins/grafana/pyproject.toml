[project]
name = "opensre-plugin-grafana"
version = "0.1.0"
description = "OpenSRE grafana integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "grafana"
tools_package = "grafana_plugin.tools"
description = "Bridged grafana tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafana_plugin"]
