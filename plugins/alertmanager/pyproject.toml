[project]
name = "opensre-plugin-alertmanager"
version = "0.1.0"
description = "OpenSRE alertmanager integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "alertmanager"
tools_package = "alertmanager_plugin.tools"
description = "Bridged alertmanager tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alertmanager_plugin"]
