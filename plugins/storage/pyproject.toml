[project]
name = "opensre-plugin-storage"
version = "0.1.0"
description = "OpenSRE storage integration plugin (4 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "storage"
tools_package = "storage_plugin.tools"
description = "Bridged storage tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storage_plugin"]
