[project]
name = "opensre-plugin-opsgenie"
version = "0.1.0"
description = "OpenSRE opsgenie integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "opsgenie"
tools_package = "opsgenie_plugin.tools"
description = "Bridged opsgenie tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsgenie_plugin"]
