[project]
name = "opensre-plugin-knowledge"
version = "0.1.0"
description = "OpenSRE knowledge integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "knowledge"
tools_package = "knowledge_plugin.tools"
description = "Bridged knowledge tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_plugin"]
