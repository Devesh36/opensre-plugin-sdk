[project]
name = "opensre-plugin-azure"
version = "0.1.0"
description = "OpenSRE azure integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "azure"
tools_package = "azure_plugin.tools"
description = "Bridged azure tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["azure_plugin"]
