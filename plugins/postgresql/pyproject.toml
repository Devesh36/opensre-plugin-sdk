[project]
name = "opensre-plugin-postgresql"
version = "0.1.0"
description = "OpenSRE postgresql integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "postgresql"
tools_package = "postgresql_plugin.tools"
description = "Bridged postgresql tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postgresql_plugin"]
