[project]
name = "opensre-plugin-airflow"
version = "0.1.0"
description = "OpenSRE airflow integration plugin (3 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "airflow"
tools_package = "airflow_plugin.tools"
description = "Bridged airflow tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airflow_plugin"]
