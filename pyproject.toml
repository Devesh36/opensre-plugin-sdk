[project]
name = "opensre-plugin-sdk"
version = "0.1.0"
description = "SDK for building external OpenSRE investigation tool plugins"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenSRE Plugin SDK contributors" }]
keywords = ["opensre", "sre", "plugins", "observability", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8",
    "jinja2>=3",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Devesh36/opensre-plugin-sdk"
Documentation = "https://github.com/Devesh36/opensre-plugin-sdk#readme"
Repository = "https://github.com/Devesh36/opensre-plugin-sdk"
Issues = "https://github.com/Devesh36/opensre-plugin-sdk/issues"
Changelog = "https://github.com/Devesh36/opensre-plugin-sdk/releases"

[project.optional-dependencies]
opensre = ["opensre>=0.1"]
plugins = ["opensre-plugins[all]"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.8"]

[project.scripts]
opensre-plugin = "opensre_plugin.cli.main:main"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "plugins/linear",
    "plugins/mock",
    "plugins/opensre_plugins",
    "plugins/airflow",
    "plugins/alertmanager",
    "plugins/argocd",
    "plugins/aws_sdk",
    "plugins/azure",
    "plugins/azure_sql",
    "plugins/batch",
    "plugins/betterstack",
    "plugins/bitbucket",
    "plugins/clickhouse",
    "plugins/cloudwatch",
    "plugins/coralogix",
    "plugins/dagster",
    "plugins/datadog",
    "plugins/ec2",
    "plugins/eks",
    "plugins/elasticsearch",
    "plugins/github",
    "plugins/gitlab",
    "plugins/google_docs",
    "plugins/grafana",
    "plugins/helm",
    "plugins/hermes",
    "plugins/honeycomb",
    "plugins/incident_io",
    "plugins/jenkins",
    "plugins/jira",
    "plugins/kafka",
    "plugins/knowledge",
    "plugins/mariadb",
    "plugins/mongodb",
    "plugins/mongodb_atlas",
    "plugins/mysql",
    "plugins/openclaw",
    "plugins/openobserve",
    "plugins/opensearch",
    "plugins/opsgenie",
    "plugins/postgresql",
    "plugins/prefect",
    "plugins/rabbitmq",
    "plugins/rds",
    "plugins/sentry",
    "plugins/signoz",
    "plugins/snowflake",
    "plugins/splunk",
    "plugins/storage",
    "plugins/supabase",
    "plugins/tracer_web",
    "plugins/twilio",
    "plugins/vercel",
    "plugins/victoria_logs"
]

