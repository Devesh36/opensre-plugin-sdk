[project]
name = "opensre-plugin-bitbucket"
version = "0.1.0"
description = "OpenSRE bitbucket integration plugin (3 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "bitbucket"
tools_package = "bitbucket_plugin.tools"
description = "Bridged bitbucket tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitbucket_plugin"]
