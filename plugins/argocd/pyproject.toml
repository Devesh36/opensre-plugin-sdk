[project]
name = "opensre-plugin-argocd"
version = "0.1.0"
description = "OpenSRE argocd integration plugin (2 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "argocd"
tools_package = "argocd_plugin.tools"
description = "Bridged argocd tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argocd_plugin"]
