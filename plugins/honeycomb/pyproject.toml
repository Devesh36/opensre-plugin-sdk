[project]
name = "opensre-plugin-honeycomb"
version = "0.1.0"
description = "OpenSRE honeycomb integration plugin (1 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "honeycomb"
tools_package = "honeycomb_plugin.tools"
description = "Bridged honeycomb tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["honeycomb_plugin"]
