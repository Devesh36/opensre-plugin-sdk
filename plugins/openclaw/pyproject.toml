[project]
name = "opensre-plugin-openclaw"
version = "0.1.0"
description = "OpenSRE openclaw integration plugin (5 tool(s), bridged from core)"
requires-python = ">=3.12"
dependencies = [
    "opensre-plugin-sdk",
]

[project.optional-dependencies]
opensre = ["opensre>=0.1"]

[tool.opensre-plugin]
name = "openclaw"
tools_package = "openclaw_plugin.tools"
description = "Bridged openclaw tools for OpenSRE investigations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openclaw_plugin"]
